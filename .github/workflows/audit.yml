name: Security audit

github-token:
  action-input:
    input: GITHUB_TOKEN
    is-default: false
  permissions:
    issues: write
    issues-reason: to create issues
    checks: write
    checks-reason: to create check

inputs:
  github-token:
    description: |
      The github-token to use.
    default: ${{ github.token }}
    required: true
on:
  schedule:
    - cron: "0 0 1,15 * *"
  pull_request:
    branches: [ "main" ]
  push:
    paths: 
      - '**/Cargo.toml'
      - '**/Cargo.lock'
jobs:
  security_audit:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}